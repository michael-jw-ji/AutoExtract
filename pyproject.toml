[project]
name = "autoextract"
version = "0.1.0"
description = "Self-improving structured extraction service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # uvicorn --reload calls watchfiles.watch(ignore_permission_denied=...).
    # A partial install leaves the Rust extension out of sync with the Python
    # wrapper, so the kwarg exists in source but the loaded module rejects it
    # -- the reloader then crashes at startup AFTER printing "Uvicorn running".
    # If that happens: pip install --force-reinstall watchfiles
    "watchfiles>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Deploying the large model (infra/modal_llm.py). Not needed to run the pipeline.
infra = ["modal"]
# Local LoRA training (scripts/train_local.py). Install torch FIRST, from the
# CUDA index that matches your driver, or pip pulls a CPU-only build:
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
train = ["transformers", "peft", "trl", "accelerate", "datasets"]

[tool.setuptools]
packages = ["core", "verify", "serve", "buffer", "repair", "train", "evalgate", "api", "domains"]

[tool.pytest.ini_options]
pythonpath = ["."]
