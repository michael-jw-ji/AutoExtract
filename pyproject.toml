[project]
name = "insider-reading"
version = "0.1.0"
description = "Insider Reading: SEC Form 4 extraction with a CI-enforced eval gate"
requires-python = ">=3.11"
dependencies = [
    # The local review tools (scripts/label_form4.py, scripts/failures_form4.py).
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # Tracing of model calls (serve/tracing.py), GenAI semantic conventions.
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    # MCP server (mcp_server.py); 2.x API (MCPServer).
    "mcp>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Deploying the models and training on Modal (infra/). Not needed for `make ci`.
infra = ["modal"]

[tool.setuptools]
packages = ["core", "verify", "serve", "evalgate", "domains"]

[tool.pytest.ini_options]
pythonpath = ["."]
