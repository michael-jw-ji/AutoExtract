[project]
name = "autoextract"
version = "0.1.0"
description = "Self-improving structured extraction service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # uvicorn --reload calls watchfiles.watch(ignore_permission_denied=...).
    # A partial install leaves the Rust extension out of sync with the Python
    # wrapper, so the kwarg exists in source but the loaded module rejects it
    # -- the reloader then crashes at startup AFTER printing "Uvicorn running".
    # If that happens: pip install --force-reinstall watchfiles
    "watchfiles>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["core", "verify", "serve", "buffer", "repair", "train", "evalgate", "api"]

[tool.pytest.ini_options]
pythonpath = ["."]
